version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: ../Dockerfile.backend
    container_name: litlingua-backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./litlingua.db
      - CORS_ORIGINS=http://localhost:5173,http://localhost:3000
      - DEBUG=True
      - TESSERACT_PATH=/usr/bin/tesseract
      - MODEL_CACHE_DIR=/app/data/offline_models
    volumes:
      - ./backend:/app
      - backend-data:/app/data
      - backend-static:/app/static
    networks:
      - litlingua-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: ../Dockerfile.frontend
    container_name: litlingua-frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./frontend:/app
      - /app/node_modules
    networks:
      - litlingua-network
    depends_on:
      - backend
    restart: unless-stopped

networks:
  litlingua-network:
    driver: bridge

volumes:
  backend-data:
  backend-static:
